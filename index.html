<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>3on3 FreeStyle Maintenance Notice</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23FF5A1F'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='2'%3E%3Ccircle cx='16' cy='16' r='9'/%3E%3Cpath d='M7 16h18M16 7v18M10 9.5c3 3.5 3 9.5 0 13M22 9.5c-3 3.5-3 9.5 0 13'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 3on3 FreeStyle 공지 홈 — 점검 안내를 한 줄로 읽어 내려가는 기사형. 점검 후 추가 안내 → 점검 하이라이트 → 영역별 변경 카드(전 ⇒ 후) → 버그 수정. 그리는 방식은 maint.js */
:root{
  --bg:#151515;--hd:#0E0E0E;--panel:#1D1D1D;--panel2:#252525;--line:#343434;--line2:#2A2A2A;
  --t1:#FFFFFF;--t2:#E2E2E2;--t3:#ABABAB;--t4:#7E7E7E;
  --or:#FF5A1F;--or-l:#FF7A45;
  --t-limit:#FF5F5F;--t-new:#5BD68A;--t-renew:#FF8A3D;--t-change:#4FB3FF;--t-event:#C79BFF;--t-end:#A3A3A3;--t-reward:#FFC24D;
  --gnb:52px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--t2);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Yu Gothic UI",Meiryo,sans-serif;font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-wrap:break-word}
html:lang(ko) body{word-break:keep-all}
html:lang(ja) body{font-family:"Pretendard Variable",Pretendard,"Yu Gothic UI","Yu Gothic",Meiryo,"Hiragino Sans",-apple-system,"Malgun Gothic",sans-serif;line-break:strict}
ul,ol{list-style:none}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--t1);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px}
.art{max-width:940px;margin:0 auto;padding:0 24px}

/* 머리 */
.hd{background:var(--hd)}
.hd .wrap{height:60px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:9px;font-size:18px;font-weight:800;letter-spacing:-.4px;text-decoration:none;color:var(--t1)}
.logo svg{width:26px;height:26px;flex:none}
.langs{display:flex;align-items:center;gap:2px}
.langs button{border:0;background:none;font-size:13px;font-weight:700;color:var(--t4);padding:5px 10px;border-radius:6px;cursor:pointer}
.langs button.on{color:#fff;background:var(--or)}

/* 단원 탭 */
.gnb{position:sticky;top:0;z-index:30;background:rgba(14,14,14,.95);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.gnb .art{position:relative}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -12px}
.tabs::-webkit-scrollbar{display:none}
.tabs a{position:relative;flex:none;display:flex;align-items:center;gap:6px;height:var(--gnb);padding:0 12px;font-size:15px;font-weight:700;color:var(--t3);text-decoration:none;white-space:nowrap}
.tabs a em{font-style:normal;font-size:11.5px;font-weight:800;color:#fff;background:var(--or);border-radius:9px;min-width:18px;line-height:18px;text-align:center;padding:0 5px}
.tabs a:hover,.tabs a.on{color:var(--t1)}
.tabs a.on::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;background:var(--or)}
.gnb .art::before,.gnb .art::after{content:"";position:absolute;top:0;bottom:0;width:32px;z-index:1;pointer-events:none;opacity:0;transition:opacity .15s}
.gnb .art::before{left:0;background:linear-gradient(90deg,var(--hd) 20%,rgba(14,14,14,0))}
.gnb .art::after{right:0;background:linear-gradient(270deg,var(--hd) 20%,rgba(14,14,14,0))}
.gnb.more-l .art::before,.gnb.more-r .art::after{opacity:1}

/* 제목: 위는 코트 사진, 아래로 겹쳐 제목 */
.hero{position:relative}
.hero-img{height:320px;background:#1C1C1C url(bg.jpg) center 40%/cover no-repeat;position:relative}
.hero-img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(21,21,21,.15) 0%,rgba(21,21,21,.6) 55%,var(--bg) 100%)}
.hero .art{position:relative;z-index:1;margin-top:-132px}
.past{margin-bottom:16px;font-size:14px;font-weight:700;color:#FFD9C9;background:rgba(20,20,20,.82);border:1px solid rgba(255,90,31,.55);border-radius:4px;padding:10px}
.past .msg{padding:0 4px 10px;text-align:center}
.past .msg a{color:#fff}
.pns{display:flex;justify-content:space-between;gap:8px}
.pn{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--line);background:#141414;border-radius:3px;color:#fff;text-decoration:none;font-size:22px;font-weight:400;line-height:1}
.pn.newer{justify-content:flex-end;text-align:right}
.pn>span{display:flex;flex-direction:column;gap:3px;min-width:0}
.pn small{font-size:12px;font-weight:700;color:var(--t3)}
.pn b{font-size:14.5px;font-weight:800;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pn:hover{border-color:var(--or)}
.pn.off{opacity:.35}
.past[hidden]{display:none}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;font-size:14px;font-weight:700;color:var(--t3)}
.cat{color:#fff;background:var(--or);padding:3px 10px;border-radius:3px;font-weight:800}
.meta #ribbon{color:var(--t1)}
.meta time{color:var(--t3);font-weight:600}
.meta time:empty,.cat:empty,#ribbon:empty{display:none}
.hero h1{font-size:clamp(42px,6.4vw,76px);font-weight:900;font-style:italic;letter-spacing:-.035em;line-height:1.04;margin-top:14px;color:#fff}
.hero h1 b{color:var(--or)}
html:lang(ja) .hero h1 b{display:inline-block}   /* 일본어는 'メンテナンス'가 중간에서 끊기지 않게 통째로 다음 줄로 */
.intro{margin-top:26px;padding:16px 22px;border-left:4px solid var(--or);background:rgba(255,255,255,.045);font-size:17px;color:var(--t2);line-height:1.7}
.intro:empty{display:none}

/* 단원 머리 */
.ch{padding-top:60px;scroll-margin-top:var(--gnb)}
.ch h2{display:flex;align-items:center;gap:14px;font-size:clamp(26px,3vw,34px);font-weight:900;font-style:italic;letter-spacing:-.025em;line-height:1.2;color:#fff;padding-bottom:16px;border-bottom:2px solid var(--line)}
.h2-ic{flex:none;width:40px;height:40px;display:grid;place-items:center;background:var(--or);color:#fff;border-radius:3px;transform:skewX(-10deg)}
.h2-ic svg{width:21px;height:21px;transform:skewX(10deg)}

/* 점검 후 추가 안내 */
.mp{margin-top:20px;border:1px solid var(--line);background:var(--panel)}
.mp-g{padding:22px 26px}
.mp-g+.mp-g{border-top:1px solid var(--line2)}
.mp-g h3{font-size:19px;font-weight:800;color:#fff;margin-bottom:12px;font-variant-numeric:tabular-nums}
.mp-r{display:grid;grid-template-columns:minmax(96px,max-content) minmax(0,1fr);gap:16px;align-items:start}
.mp-r+.mp-r{margin-top:14px}
.mp-r p{font-size:16px;color:var(--t2);line-height:1.72;text-wrap:pretty}
.mp-empty{padding:22px 26px;color:var(--t3)}
.sb{display:block;text-align:center;font-size:13px;font-weight:800;line-height:27px;border-radius:3px;padding:0 8px;white-space:nowrap}
.sb.checking{background:#4A3A12;color:#FFC24D}
.sb.planned{background:rgba(255,90,31,.2);color:#FF8A5C}
.sb.fixed{background:#1D3A26;color:#5BD68A}

/* 점검 하이라이트 */
.hl{margin-top:20px;border:1px solid var(--line);background:radial-gradient(90% 120% at 0% 0%,rgba(255,90,31,.13),rgba(255,90,31,0) 60%),#1A1A1A;padding:24px}
.hl-no{display:flex;align-items:baseline;gap:10px;padding-bottom:16px;margin-bottom:20px;border-bottom:1px solid var(--line)}
.hl-no b{font-size:36px;font-weight:900;font-style:italic;color:#fff;letter-spacing:-.02em;line-height:1}
.hl-no span{font-size:15px;font-weight:800;color:var(--or)}
.hl-grid{display:grid;grid-template-columns:280px minmax(0,1fr);gap:24px;align-items:start}
.hl-grid.solo{grid-template-columns:minmax(0,1fr)}
.hl-big{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:280px;overflow:hidden;border:1px solid var(--c);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 30%,#1A1A1A) 0%,#161616 78%);padding:18px 20px;text-decoration:none;color:#fff;transition:transform .15s}
.hl-big:hover{transform:translateY(-3px)}
.hl-big img{position:absolute;left:8%;top:12px;width:84%;height:64%;object-fit:contain}
.hl-big img.ban{left:0;top:0;width:100%;height:66%;object-fit:cover;object-position:left center;-webkit-mask-image:linear-gradient(180deg,#000 70%,transparent);mask-image:linear-gradient(180deg,#000 70%,transparent)}
.hl-bi{position:absolute;left:0;right:0;top:40px;display:grid;place-items:center;color:var(--c)}
.hl-bi svg{width:88px;height:88px}
.hl-big .tag{align-self:flex-start;position:relative}
.hl-big b{position:relative;font-size:23px;font-weight:900;letter-spacing:-.02em;line-height:1.3;margin-top:8px}
.hl-hit{position:absolute;inset:0;z-index:1}
.hl-hit:focus-visible{outline-offset:-4px}
.hl-go{position:relative;z-index:2;align-self:flex-start;display:inline-flex;align-items:center;gap:6px;margin-top:14px;font-size:14px;font-weight:800;color:#fff;background:var(--or);border-radius:3px;padding:9px 14px;text-decoration:none}
.hl-go:hover{background:#E84E15}
.hl-go svg{width:16px;height:16px}
.hl-g+.hl-g{margin-top:20px}
.hl-gk{display:flex;align-items:center;gap:7px;font-size:14.5px;font-weight:800;color:var(--c);margin-bottom:10px}
.hl-gk svg{width:17px;height:17px}
.hl-g ul{display:flex;flex-wrap:wrap;gap:8px}
.hl-g a{display:flex;align-items:center;gap:11px;min-height:52px;padding:6px 14px 6px 6px;border:1px solid var(--line);border-left:3px solid var(--c);background:#141414;text-decoration:none;color:var(--t1);font-size:15px;font-weight:700;line-height:1.35;transition:background .15s}
.hl-g a:hover{background:var(--panel2)}
.hl-ic{flex:none;width:40px;height:40px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,#141414);color:var(--c)}
.hl-ic svg{width:21px;height:21px}
.hl-ic.pic img,.pc-ic.pic img{width:100%;height:100%;object-fit:cover}
.dd{font-style:normal;font-size:12.5px;font-weight:800;line-height:22px;border-radius:3px;padding:0 8px;background:var(--t-limit);color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap}
.dd.end{background:var(--panel2);color:var(--t3)}
.dd:empty{display:none}

/* 변경 카드 */
.pc{margin-top:18px;border:1px solid var(--line);background:var(--panel);padding:26px 30px 28px}
.pc-h{display:flex;align-items:center;gap:18px}
.pc-ic{flex:none;width:76px;height:76px;display:grid;place-items:center;overflow:hidden;border:1px solid color-mix(in srgb,var(--c) 55%,var(--line));background:color-mix(in srgb,var(--c) 14%,#161616);color:var(--c)}
.pc-ic svg{width:36px;height:36px}
.pc-ic.pic{background:color-mix(in srgb,var(--c) 22%,#161616)}
.pc-ic.pic img{object-fit:contain;padding:4px}
.pc-t{min-width:0}
.tag{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.03em;line-height:20px;padding:0 8px;border:1px solid var(--c);color:var(--c);border-radius:3px;background:color-mix(in srgb,var(--c) 10%,transparent)}
.pc h3{font-size:23px;font-weight:800;letter-spacing:-.03em;line-height:1.35;color:#fff;margin-top:5px}
.ctx{margin-top:20px;padding:2px 0 2px 18px;border-left:3px solid #4A4A4A;font-size:16px;color:var(--t2);line-height:1.78;text-wrap:pretty}
.when{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:18px;padding:14px 18px;background:#171717;border:1px solid var(--line);border-left:4px solid var(--t-limit)}
.when span{font-size:14px;font-weight:700;color:var(--t3)}
.when b{font-size:22px;font-weight:900;letter-spacing:-.02em;color:#fff;font-variant-numeric:tabular-nums}
.pc h4{margin-top:24px;font-size:16.5px;font-weight:800;color:#fff;padding-bottom:9px;border-bottom:1px solid var(--line)}
.chg,.dots{margin-top:12px}
.chg li,.dots li{position:relative;padding-left:20px;font-size:16px;line-height:1.7;color:var(--t2)}
.chg li+li,.dots li+li{margin-top:8px}
.chg li::before,.dots li::before{content:"";position:absolute;left:4px;top:.68em;width:6px;height:6px;background:var(--t3);transform:rotate(45deg)}
.chg b,.dots b{color:#fff;font-weight:700}
.chg .was{color:var(--t3)}
.chg i{font-style:normal;font-weight:900;color:var(--or);margin:0 9px}
.chg strong,.dots strong{color:#fff;font-weight:800}
.dots.plain{margin-top:20px}
.dots.plain li{font-size:16.5px}
.note{margin-top:16px;font-size:14.5px;color:var(--t3);line-height:1.65;padding-left:1.1em;text-indent:-1.1em;text-wrap:pretty}
.lnk{display:inline-flex;align-items:center;gap:6px;margin-top:20px;font-size:15px;font-weight:800;color:#fff;background:var(--or);border-radius:3px;padding:11px 16px 11px 20px;text-decoration:none}
.lnk:hover{background:#E84E15}
.lnk svg{width:17px;height:17px}
.addn{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);font-size:15.5px;color:var(--t2);line-height:1.65}
.addn span{display:inline-block;font-size:12.5px;font-weight:800;color:var(--or-l);border:1px solid rgba(255,122,69,.5);border-radius:3px;padding:0 7px;line-height:20px;margin-right:9px;white-space:nowrap}

/* 누르면 크게 보는 그림(배너·화면) */
.pc-ban{flex:none;margin-left:auto;position:relative;width:216px;aspect-ratio:1200/344;padding:0;border:1px solid var(--line);background:#111;border-radius:3px;overflow:hidden;cursor:zoom-in}
.pc-ban img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .25s}
.pc-ban:hover img,.pc-ban:focus-visible img{transform:scale(1.06)}
.pc-ban:hover{border-color:var(--or)}
.zoom{position:absolute;right:5px;bottom:5px;display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;line-height:20px;color:#fff;background:rgba(0,0,0,.78);border-radius:3px;padding:0 7px 0 5px}
.zoom svg{width:13px;height:13px}
.pops{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.pop-chip{display:flex;align-items:center;gap:12px;width:100%;max-width:520px;font:inherit;font-size:15.5px;font-weight:700;color:var(--t1);text-align:left;background:#161616;border:1px solid var(--line);border-radius:3px;padding:5px 12px 5px 5px;cursor:zoom-in;transition:border-color .15s,background .15s}
.pop-chip img{flex:none;width:118px;aspect-ratio:1200/344;object-fit:cover;border-radius:2px;display:block}
.pop-chip span{flex:1;min-width:0}
.pop-chip svg{flex:none;width:17px;height:17px;color:var(--t3)}
.pop-chip:hover{border-color:var(--or);background:#1B1B1B}
.pop-chip:hover svg{color:var(--or)}
.pop-chip.plain{cursor:default;padding:10px 14px}
.iss-pop{display:inline-flex;align-items:center;gap:5px;margin-top:10px;font:inherit;font-size:13.5px;font-weight:800;color:#fff;background:#141414;border:1px solid var(--line);border-radius:3px;padding:5px 10px;cursor:zoom-in}
.iss-pop:hover{border-color:var(--or)}
.iss-pop svg{width:15px;height:15px}
.lb{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:64px 20px 28px;background:rgba(0,0,0,.84);cursor:zoom-out;animation:lbIn .18s ease-out}
.lb[hidden]{display:none}
.lb figure{max-width:min(1200px,100%);cursor:default}
.lb img{display:block;max-width:100%;max-height:78vh;margin:0 auto;border-radius:4px;box-shadow:0 12px 40px rgba(0,0,0,.6)}
.lb figcaption{margin-top:12px;text-align:center;font-size:15px;font-weight:700;color:#fff}
.lb figcaption:empty{display:none}
.lb-x{position:absolute;top:14px;right:14px;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;border:1px solid #555;background:#1D1D1D;color:#fff;cursor:pointer}
.lb-x svg{width:20px;height:20px}
html.lb-on{overflow:hidden}
@keyframes lbIn{from{opacity:0}to{opacity:1}}

/* 가이드 배너: 넓은 화면은 오른쪽에 떠 있는 작은 배너, 좁은 화면은 첫 화면 안 띠. 가이드가 쌓이면 돌아가며 보여 줌 */
.gr{position:fixed;right:20px;top:128px;z-index:25;width:186px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:10px 10px 12px;box-shadow:0 10px 28px rgba(0,0,0,.45)}
.gr[hidden]{display:none}
.gr-k{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;color:var(--t3);margin:0 2px 8px}
.gr-n{font-weight:700;color:var(--t4);font-variant-numeric:tabular-nums}
.gr-vp{position:relative;height:178px;transition:height .35s}
.gr-s{position:absolute;top:0;left:0;right:0;display:flex;flex-direction:column;gap:8px;text-decoration:none;color:#fff;opacity:0;transform:translateX(14px);transition:opacity .45s,transform .45s;pointer-events:none}
.gr-s.on{opacity:1;transform:none;pointer-events:auto}
.gr-art{display:block;border-radius:3px;overflow:hidden;background:radial-gradient(120% 120% at 70% 100%,color-mix(in srgb,var(--g) 55%,transparent),#191919 70%)}
.gr-art img{display:block;width:100%;height:auto;transition:transform .3s}
.gr-s:hover .gr-art img{transform:scale(1.05)}
.gr-art{position:relative}
.gr-play{position:absolute;left:50%;top:50%;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.gr-play svg{width:20px;height:20px}
.gr-t{display:flex;flex-direction:column;gap:3px;padding:0 2px}
.gr-t small{font-size:11px;font-weight:700;color:var(--t4)}
.gr-t b{font-size:15px;font-weight:900;font-style:italic;line-height:1.25}
.gr-t em{display:inline-flex;align-items:center;gap:4px;font-style:normal;font-size:12.5px;font-weight:800;color:var(--g)}
.gr-t em svg{width:14px;height:14px}
.gr-dots{display:flex;justify-content:center;gap:6px;margin-top:6px}
.gr-dots button{width:7px;height:7px;padding:0;border:0;border-radius:50%;background:#4A4A4A;cursor:pointer}
.gr-dots button.on{width:18px;border-radius:4px;background:var(--or)}
.gr-dots{align-items:center}
.gr-dots .gr-ar{width:22px;height:22px;border-radius:50%;background:transparent;color:var(--t3);display:grid;place-items:center;margin:0 2px}
.gr-dots .gr-ar:hover{background:#333;color:#fff}
.gr-dots .gr-ar svg{width:14px;height:14px}
@media (max-width:1379px){   /* 본문(940)+양옆 배너 자리가 안 되면 첫 화면 안으로 */
  .gr{position:relative;right:auto;top:auto;width:auto;margin-top:16px;box-shadow:none;padding:8px 10px}
  .gr-k{margin-bottom:6px}
  .gr-vp{height:76px}
  .gr-s{flex-direction:row;align-items:center;gap:14px}
  .gr-art{flex:none;width:132px}
  .gr-t b{font-size:16px}
  .gr-dots{position:absolute;right:8px;top:4px;margin:0}   /* 화살표가 붙어 넓어져 제목줄로(11/04) — 순번은 점이 대신 */
  .gr-n{display:none}
}

/* 지난 점검 안내: 달 표시 + 좌우 버튼 / 달별 줄(손가락으로 밀기) / 달 고르는 스크롤 바 */
.ch-archive h2{font-size:clamp(22px,2.4vw,26px)}
.ch-archive .h2-ic{width:34px;height:34px;background:var(--panel2)}
.ar{margin-top:18px;border:1px solid var(--line);background:var(--panel);padding:16px 0 6px}
.ar-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px}
.ar-btn{flex:none;width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--line);background:#141414;color:var(--t1);border-radius:3px;cursor:pointer}
.ar-btn:hover:not(:disabled){border-color:var(--or);color:var(--or)}
.ar-btn:disabled{opacity:.3;cursor:default}
.ar-btn svg{width:20px;height:20px}
.ar-now{text-align:center;line-height:1.3}
.ar-now b{display:block;font-size:20px;font-weight:900;color:#fff}
.ar-now span{font-size:13px;font-weight:700;color:var(--t3)}
.ar-track{position:relative;display:flex;gap:22px;overflow-x:auto;scrollbar-width:none;padding:16px 16px 4px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.ar-track::-webkit-scrollbar{display:none}
.ar-mon{flex:none;scroll-snap-align:start}
.ar-ml{font-size:13px;font-weight:800;color:var(--t4);margin-bottom:8px}
.ar-mon.on .ar-ml{color:var(--or)}
.ar-mon ul{display:flex;gap:10px}
.wk{position:relative;display:flex;flex-direction:column;width:196px;min-height:82px;border:1px solid var(--line);background:#161616;padding:12px 16px;text-decoration:none;transition:border-color .15s}
.wk:hover{border-color:var(--t3)}
.wk b{font-size:15.5px;font-weight:800;color:var(--t1);line-height:1.35;padding-right:44px}
.wk span{font-size:13px;color:var(--t4);margin-top:4px}
.wk em{position:absolute;right:8px;top:8px;font-style:normal;font-size:11.5px;font-weight:800;line-height:19px;color:#fff;background:var(--panel2);border-radius:3px;padding:0 6px}
.wk.cur{border-color:var(--or);background:color-mix(in srgb,var(--or) 12%,#161616)}
.ar-mon .wk{transition:border-color .15s,opacity .2s}
.ar-mon:not(.on) .wk{opacity:.55}   /* 고른 달만 또렷하게 */
.wk.cur em{background:var(--or)}
.ar-scrub{position:relative;margin:12px 16px 0;padding-bottom:26px}
.ar-range{display:block;width:100%;height:28px;margin:0;background:transparent;cursor:pointer;-webkit-appearance:none;appearance:none}
.ar-range::-webkit-slider-runnable-track{height:6px;background:#2E2E2E;border-radius:3px}
.ar-range::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-8px;border-radius:50%;background:var(--or);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.ar-range::-moz-range-track{height:6px;background:#2E2E2E;border-radius:3px}
.ar-range::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--or);border:3px solid #fff}
.ar-ticks{position:absolute;left:11px;right:11px;top:24px;height:24px;pointer-events:none}
.ar-ticks span{position:absolute;top:0;width:2px;height:6px;margin-left:-1px;background:#555}
.ar-ticks span[data-l]::after{content:attr(data-l);position:absolute;top:9px;left:50%;transform:translateX(-50%);font-size:11.5px;font-weight:600;color:var(--t4);white-space:nowrap}
.ar-ticks span:first-child[data-l]::after{left:-6px;transform:none}
.ar-ticks span:last-child[data-l]::after{left:auto;right:-6px;transform:none}

/* 바닥 */
.foot{margin-top:72px;border-top:1px solid var(--line);padding:28px 0 52px;font-size:14px;color:var(--t4);line-height:1.7}
.foot .bye{font-size:15px;color:var(--t3);margin-bottom:6px}

/* 맨 위 · 맨 아래 */
.jump{position:fixed;right:18px;bottom:22px;z-index:40;display:flex;flex-direction:column;gap:8px}
.jump button{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--t1);box-shadow:0 4px 14px rgba(0,0,0,.45);display:grid;place-items:center;cursor:pointer}
.jump button:hover{background:var(--panel2)}
.jump button svg{width:20px;height:20px}
.jump button[hidden]{display:none}

/* 캡처용(?shot) */
.shot{scroll-behavior:auto}
.shot *,.shot *::before,.shot *::after{animation:none!important;transition:none!important}

@media (max-width:759px){
  body{font-size:15.5px}
  .wrap,.art{padding:0 16px}
  .hd .wrap{height:54px}
  .logo{font-size:16.5px}.logo svg{width:24px;height:24px}
  .tabs{margin:0 -16px;padding:0 6px}
  .tabs a{font-size:14.5px;padding:0 10px}
  .hero-img{height:210px}
  .hero .art{margin-top:-92px}
  .hero h1{font-size:42px}
  html:lang(ja) .hero h1{font-size:32px}
  .intro{font-size:15.5px;padding:14px 16px;margin-top:20px}
  .ch{padding-top:44px}
  .ch h2{font-size:25px;gap:11px;padding-bottom:13px}
  .h2-ic{width:34px;height:34px}.h2-ic svg{width:18px;height:18px}
  .mp-g{padding:18px 16px}
  .mp-r{grid-template-columns:minmax(0,1fr);gap:8px}
  .mp-r .sb{justify-self:start;padding:0 12px}
  .mp-r p{font-size:15.5px}
  .hl{padding:16px}
  .hl-no b{font-size:28px}
  .hl-grid{grid-template-columns:minmax(0,1fr);gap:18px}
  .hl-big{min-height:230px}
  .hl-g a{font-size:14.5px;width:100%}
  .hl-g li{flex:1 1 100%}
  .pc{padding:20px 16px 22px;margin-top:14px}
  .pc-h{gap:14px}
  .pc-ic{width:58px;height:58px}.pc-ic svg{width:28px;height:28px}
  .pc h3{font-size:19.5px}
  .ctx{font-size:15.5px;padding-left:14px;margin-top:16px}
  .when b{font-size:19px}
  .chg li,.dots li{font-size:15.5px}
  .chg i{margin:0 6px}
  .pc-h{flex-wrap:wrap}
  .pc-ban{order:3;width:100%;margin-left:0}
  .pop-chip img{width:96px}
  .wk{width:168px}
  .ar-ticks span.alt::after{display:none}
  .ar-now b{font-size:18px}
  .pn{padding:8px 10px}
  .foot{margin-top:52px}
  .jump{right:12px;bottom:16px}
}
</style>
